<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3326"/>
      <stop offset="1" stop-color="#0c0f0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#e0b04a"/>
      <stop offset="1" stop-color="#a87a22"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a3a"/>
      <stop offset="1" stop-color="#0a121c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd3ff"/>
      <stop offset="1" stop-color="#2f8fd8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dde3"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#c9952f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="11" y="11" width="234" height="234" rx="49" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.9"/>

  <!-- monitor -->
  <g filter="url(#shadow)">
    <rect x="34" y="48" width="188" height="128" rx="14" fill="url(#gold)"/>
    <rect x="44" y="58" width="168" height="108" rx="7" fill="url(#screen)"/>
    <path d="M108 176 h40 l6 22 h-52 z" fill="url(#gold)"/>
    <rect x="84" y="196" width="88" height="10" rx="5" fill="url(#gold)"/>
  </g>

  <!-- cloud on screen (the virtual desktop) -->
  <path d="M86 138 a22 22 0 0 1 4-43.6 a30 30 0 0 1 56-6 a24 24 0 0 1 28 22.6 a18 18 0 0 1-6 27z"
        fill="none" stroke="url(#glow)" stroke-width="7" stroke-linejoin="round"/>
  <!-- connection bars inside the cloud -->
  <g fill="url(#glow)">
    <rect x="108" y="116" width="8" height="14" rx="2"/>
    <rect x="122" y="108" width="8" height="22" rx="2"/>
    <rect x="136" y="100" width="8" height="30" rx="2"/>
  </g>

  <!-- CAC card in front -->
  <g filter="url(#shadow)" transform="rotate(-10 186 186)">
    <rect x="140" y="150" width="96" height="62" rx="9" fill="url(#card)" stroke="#9aa3ad" stroke-width="1.5"/>
    <rect x="140" y="196" width="96" height="16" rx="0" fill="#e0b04a" opacity="0.85"/>
    <rect x="140" y="150" width="96" height="62" rx="9" fill="none" stroke="#7d868f" stroke-width="1.5"/>
    <rect x="152" y="163" width="26" height="21" rx="4" fill="url(#chip)" stroke="#8a6416" stroke-width="1.2"/>
    <path d="M152 173.5 h26 M165 163 v21 M158 163 v6 M172 163 v6 M158 178 v6 M172 178 v6"
          stroke="#8a6416" stroke-width="1.2" fill="none"/>
    <rect x="186" y="164" width="38" height="5" rx="2.5" fill="#9aa3ad"/>
    <rect x="186" y="174" width="28" height="5" rx="2.5" fill="#b7bec6"/>
  </g>
</svg>
